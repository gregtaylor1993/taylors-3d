name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card
          path: dist/taylors3d-card.js

  browser:
    name: browser (${{ matrix.group }})
    needs: card
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - group: foundation
            commands: |
              node scripts/screenshot.mjs
              node scripts/edit-check.mjs
              node scripts/navigation-check.mjs
              (node scripts/model-check.mjs || (echo "model-check retry (slow shared runner timing)" && node scripts/model-check.mjs))
          - group: panels-views
            commands: |
              node scripts/panels-check.mjs
              node scripts/presets-check.mjs
              node scripts/overlays-check.mjs
              node scripts/history-check.mjs
          - group: devices-tracking
            commands: |
              node scripts/cameras-check.mjs
              node scripts/tracking-check.mjs
              node scripts/calibration-check.mjs
              node scripts/security-check.mjs
              node scripts/weather-check.mjs
          - group: lighting-walls
            commands: |
              node scripts/lighting-check.mjs
              node scripts/shading-check.mjs
              node scripts/scenes-check.mjs
              node scripts/ambient-check.mjs
              node scripts/walls-check.mjs
          - group: floors-menus
            commands: |
              node scripts/floors-check.mjs
              node scripts/floor-panels-check.mjs
              node scripts/house-check.mjs
          - group: furniture-languages
            commands: |
              node scripts/furniture-check.mjs
              node scripts/metadata-check.mjs
              node scripts/localization-check.mjs
          - group: data-controls
            commands: |
              node scripts/dashboard-backup-check.mjs
              node scripts/visual-options-check.mjs
              node scripts/room-actions-check.mjs
              node scripts/custom-controls-check.mjs
          - group: positions-labels
            commands: |
              node scripts/gps-calibration-check.mjs
              node scripts/entity-area-filter-check.mjs
              node scripts/runtime-localization-check.mjs
          - group: glass-appearance
            commands: |
              node scripts/glass-theme-check.mjs
          - group: overview-menu-search
            commands: |
              npm run check:overview
              npm run check:house-menu
              npm run check:search
          - group: ui-polish
            commands: |
              node scripts/room-sheet-check.mjs
              node scripts/editor-navigation-check.mjs
              node scripts/custom-controls-polish-check.mjs
              node scripts/ui-feedback-check.mjs
              node scripts/visual-polish-check.mjs
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle
      - name: Run native browser checks
        run: ${{ matrix.commands }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.group }}
          path: screenshots/

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            ha: "2024.7.0"
            harness: "0.13.144"
          - python: "3.13"
            ha: "2026.2.3"
            harness: "0.13.316"
          - python: "3.14"
            ha: "2026.10.0b0"
            harness: "0.13.368"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant test harness
        run: |
          HA_TEST_COMPAT=()
          # HA 2024.7's acme 2.10 imports ComparableX509, removed in josepy 2.
          if [ "${{ matrix.ha }}" = "2024.7.0" ]; then
            HA_TEST_COMPAT+=("josepy==1.14.0")
          fi
          pip install -r requirements-test.txt "homeassistant==${{ matrix.ha }}" "pytest-homeassistant-custom-component==${{ matrix.harness }}" "${HA_TEST_COMPAT[@]}"
          # the frontend package matching the installed core, needed by the frontend dependency
          FRONTEND=$(python -c "import json, importlib.resources as r; print(json.load(open(r.files('homeassistant') / 'components/frontend/manifest.json'))['requirements'][0])")
          pip install "$FRONTEND"
          pip freeze > home-assistant-test-environment.txt
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-assistant-environment-python-${{ matrix.python }}
          path: home-assistant-test-environment.txt
