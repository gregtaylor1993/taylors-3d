name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - name: Headless browser checks (demo, edit mode, navigation, model)
        run: node scripts/screenshot.mjs && node scripts/edit-check.mjs && node scripts/navigation-check.mjs && (node scripts/model-check.mjs || (echo "model-check retry (slow shared runner timing)" && node scripts/model-check.mjs))
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Headless browser checks (right panels, camera automations, overlays, camera views, tracking)
        run: node scripts/panels-check.mjs && node scripts/presets-check.mjs && node scripts/overlays-check.mjs && node scripts/history-check.mjs && node scripts/cameras-check.mjs && node scripts/tracking-check.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Headless browser checks (visual calibration, contact motion, outdoor weather)
        run: node scripts/calibration-check.mjs && node scripts/security-check.mjs && node scripts/weather-check.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Headless browser checks (room lighting and light controls)
        run: node scripts/lighting-check.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card
          path: |
            dist/taylors3d-card.js
            screenshots/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Home Assistant test harness
        run: |
          pip install -r requirements-test.txt
          # the frontend package matching the installed core, needed by the frontend dependency
          FRONTEND=$(python -c "import json, importlib.resources as r; print(json.load(open(r.files('homeassistant') / 'components/frontend/manifest.json'))['requirements'][0])")
          pip install "$FRONTEND"
      - run: python -m pytest -q
