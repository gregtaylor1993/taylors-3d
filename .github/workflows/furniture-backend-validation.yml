name: Furniture backend validation

on:
  push:
    branches: [codex/furniture-backend-validation]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the actual Home Assistant test harness
        run: |
          pip install -r requirements-test.txt
          FRONTEND=$(python -c "import json, importlib.resources as r; print(json.load(open(r.files('homeassistant') / 'components/frontend/manifest.json'))['requirements'][0])")
          pip install "$FRONTEND"
          pip freeze > furniture-test-environment.txt
      - name: Check actual integration startup, reload and original integration behavior
        run: python -m pytest -q tests/test_furniture_setup_ha.py tests/test_init.py tests/test_config_flow.py tests/test_model.py tests/test_services.py
      - name: Check immutable packs, storage and real authenticated uploads
        if: always()
        run: python -m pytest -q tests/test_furniture_pack.py tests/test_furniture.py tests/test_furniture_ha.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: furniture-test-environment-python-${{ matrix.python }}
          path: furniture-test-environment.txt
