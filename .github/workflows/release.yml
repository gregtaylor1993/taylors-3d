name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check versions match the tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          test "$(node -p "require('./package.json').version")" = "$TAG"
          test "$(node -p "require('./custom_components/taylors3d/manifest.json').version")" = "$TAG"
          grep -q "const VERSION = '$TAG'" src/taylors3d-card.js
      - run: npm run build
      - run: npm run check:bundle
      - name: Package integration (card bundled inside) for HACS
        run: |
          cp LICENSE custom_components/taylors3d/LICENSE
          cd custom_components/taylors3d
          zip -r "$GITHUB_WORKSPACE/taylors3d.zip" . -x '__pycache__/*'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" taylors3d.zip dist/taylors3d-card.js \
            --title "$GITHUB_REF_NAME" --generate-notes "${RELEASE_FLAGS[@]}"
