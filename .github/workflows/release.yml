name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check versions match the tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          test "$(node -p "require('./package.json').version")" = "$TAG"
          test "$(node -p "require('./custom_components/floorplan3d/manifest.json').version")" = "$TAG"
          grep -q "const VERSION = '$TAG'" src/floorplan3d-card.js
      - run: npm run build
      - name: Package integration (card bundled inside) for HACS
        run: |
          cd custom_components/floorplan3d
          zip -r "$GITHUB_WORKSPACE/floorplan3d.zip" . -x '__pycache__/*'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" floorplan3d.zip dist/floorplan3d-card.js \
            --title "$GITHUB_REF_NAME" --generate-notes
